[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asianoption"
version = "0.2.0"
description = "Asian option pricing methods including Monte Carlo, control variates, analytical approximations, and stochastic volatility extensions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ryan Hou" }
]
keywords = [
    "asian option",
    "option pricing",
    "monte carlo",
    "control variate",
    "turnbull wakeman",
    "levy approximation",
    "heston model",
    "sabr model",
    "stochastic volatility",
    "quantitative finance"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/RyanHou0303/AsianOption"
Repository = "https://github.com/RyanHou0303/AsianOption"
Issues = "https://github.com/RyanHou0303/AsianOption/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["asianoption*"]