[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asianoption"
version = "0.1.0"
description = "Asian option pricing methods including Monte Carlo, control variate, and analytical approximations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ryan Hou" }
]
keywords = [
    "asian option",
    "option pricing",
    "monte carlo",
    "control variate",
    "turnbull wakeman",
    "quantitative finance"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]

[project.urls]
Homepage = "https://github.com/RyanHou0303/AsianOption"
Repository = "https://github.com/RyanHou0303/AsianOption"

[tool.setuptools.packages.find]
where = ["."]
include = ["asianoption*"]